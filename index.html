<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        body {
            font-family: 'DM Sans', sans-serif;
        }

        .tab-btn {
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen">

    <div class="max-w-4xl mx-auto px-4 py-8">

        <!-- Title -->
        <h1 class="text-2xl md:text-3xl font-bold text-slate-800 mb-6">Job Application Tracker</h1>

        <!-- Dashboard Stats -->
        <div class="grid grid-cols-3 gap-3 mb-8">
            <div
                class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 transition-all duration-200 hover:shadow-md hover:-translate-y-0.5 cursor-default">
                <p class="text-xs text-slate-500 mb-1">Total</p>
                <p id="total-count" class="text-2xl md:text-3xl font-bold text-slate-800">8</p>
            </div>
            <div
                class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 transition-all duration-200 hover:shadow-md hover:-translate-y-0.5 cursor-default">
                <p class="text-xs text-slate-500 mb-1">Interview</p>
                <p id="interview-count" class="text-2xl md:text-3xl font-bold text-green-500">0</p>
            </div>
            <div
                class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 transition-all duration-200 hover:shadow-md hover:-translate-y-0.5 cursor-default">
                <p class="text-xs text-slate-500 mb-1">Rejected</p>
                <p id="rejected-count" class="text-2xl md:text-3xl font-bold text-red-500">0</p>
            </div>
        </div>

        <hr class="border-slate-200 mb-8"/>

</body>

</html>
